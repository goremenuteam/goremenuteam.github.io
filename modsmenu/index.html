<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModsMenu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #e0e0e0;
            background-color: #0d0d11;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            perspective: 1000px;
        }
        .container {
            background: linear-gradient(145deg, #1d1d26, #15151c);
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid #2e2e3d;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
            transform-style: preserve-3d;
            transform: translateY(-5px);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(98, 0, 238, 0.3);
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #a0a0b0;
            margin-bottom: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .section-header {
            text-align: left;
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #2a2a35;
            padding-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .clip-wrapper {
            position: relative;
            margin-bottom: 2rem;
            perspective: 1000px;
        }
        .gray-plate {
            position: absolute;
            top: 15px;
            left: 15px;
            right: -15px;
            bottom: -15px;
            background: linear-gradient(135deg, #3a3a4c, #272736);
            border: 1px solid #4a4a60;
            border-radius: 14px;
            z-index: 1;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6), 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        .modlist-card {
            position: relative;
            z-index: 2;
            background: linear-gradient(145deg, #252533, #1c1c26);
            border: 1px solid #333345;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: left;
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.4),
                0 4px 6px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform-style: preserve-3d;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .clip-wrapper:hover .modlist-card {
            transform: translateY(-6px) rotateX(2deg) rotateY(-1deg) scale(1.01);
            border-color: #7b2cbf;
            box-shadow: 
                0 20px 30px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(123, 44, 191, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .repo-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121218;
            border: 1px solid #282836;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
        }
        .repo-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .modlist-content {
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            color: #b0b0c2;
            white-space: pre-wrap;
            word-break: break-word;
            background: #121218;
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid #282836;
            max-height: 350px;
            overflow-y: auto;
        }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(145deg, #7b2cbf, #5a189a);
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            text-align: center;
        }
        .btn:hover {
            background: linear-gradient(145deg, #9d4edd, #7b2cbf);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(123, 44, 191, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .loading {
            color: #a0a0b0;
            font-style: italic;
        }
        .org-btn {
            display: inline-block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ModsMenu</h1>
        <p class="subtitle">A simple mod menu for Gorilla Tag.</p>

        <h2 class="section-header">The repo for the mod</h2>

        <div class="clip-wrapper">
            <div class="gray-plate"></div>
            <div class="modlist-card">
                <div class="repo-bar">
                    <span class="repo-name">ModsMenu Repository</span>
                    <a href="https://github.com/goremenuteam/ModsMenu" class="btn" target="_blank" rel="noopener">View GitHub Repo</a>
                </div>
                <div class="modlist-content" id="modlist-display">
                    <span class="loading">Loading modlist.txt from ModsMenu repository...</span>
                </div>
            </div>
        </div>

        <a href="https://github.com/goremenuteam" class="btn org-btn" target="_blank" rel="noopener">Visit Our GitHub Profile</a>
    </div>

    <script>
        async function fetchModlist() {
            const display = document.getElementById('modlist-display');
            const repoUrl = 'https://raw.githubusercontent.com/goremenuteam/ModsMenu/main/modlist.txt';
            const fallbackUrl = 'https://raw.githubusercontent.com/goremenuteam/ModsMenu/master/modlist.txt';

            try {
                let response = await fetch(repoUrl);
                if (!response.ok) {
                    response = await fetch(fallbackUrl);
                }
                if (!response.ok) {
                    throw new Error('modlist.txt not found');
                }

                const text = await response.text();
                display.textContent = text.trim() || 'modlist.txt is empty.';
            } catch (error) {
                display.textContent = 'Unable to load modlist.txt. Make sure modlist.txt exists in the root of the ModsMenu repository.';
            }
        }

        fetchModlist();
    </script>
</body>
</html>
