<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GORE Menu Team</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #e0e0e0;
            background-color: #0f0f12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            background: #18181f;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #a0a0b0;
            margin-bottom: 2rem;
        }
        .custom-player {
            background: #21212b;
            border: 1px solid #2a2a35;
            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .player-info {
            text-align: left;
        }
        .track-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }
        .track-status {
            font-size: 0.85rem;
            color: #a0a0b0;
        }
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #15151c;
            padding: 0.6rem 1rem;
            border-radius: 6px;
        }
        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }
        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .progress-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        .seek-slider, .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: #3a3a4a;
            outline: none;
            cursor: pointer;
        }
        .seek-slider::-webkit-slider-thumb, .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00aaff;
            cursor: pointer;
        }
        .seek-slider::-moz-range-thumb, .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00aaff;
            cursor: pointer;
            border: none;
        }
        .time-display {
            font-size: 0.85rem;
            color: #a0a0b0;
            white-space: nowrap;
            font-family: monospace;
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100px;
        }
        .projects-header {
            text-align: left;
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 1rem;
            border-bottom: 1px solid #2a2a35;
            padding-bottom: 0.5rem;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        .project-card {
            background: #21212b;
            border: 1px solid #2a2a35;
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .project-card:hover {
            transform: translateY(-2px);
            border-color: #6200ee;
        }
        .project-title {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }
        .project-desc {
            font-size: 0.95rem;
            color: #a0a0b0;
            margin-bottom: 1rem;
            flex-grow: 1;
        }
        .project-links {
            display: flex;
            gap: 0.5rem;
        }
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #6200ee;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
            text-align: center;
        }
        .btn:hover {
            background-color: #4b00b5;
        }
        .btn-outline {
            background-color: transparent;
            border: 1px solid #6200ee;
            color: #ffffff;
        }
        .btn-outline:hover {
            background-color: #6200ee;
        }
        .loading {
            color: #a0a0b0;
            font-style: italic;
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem 0;
        }
        .org-btn {
            display: inline-block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GORE Menu Team</h1>
        <p class="subtitle">Official page for GORE Menu projects and releases.</p>

        <div class="custom-player">
            <div class="player-info">
                <div class="track-title">Femboy Friday</div>
                <div class="track-status" id="player-status">Ready to play</div>
            </div>
            
            <div class="video-container">
                <video id="media-element" playsinline>
                    <source src="femboy-friday.mp4" type="video/mp4">
                    <source src="femboy-friday.mp3" type="audio/mpeg">
                </video>
            </div>

            <div class="controls-bar">
                <button class="icon-btn" id="play-pause-btn" aria-label="Play">
                    <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <div class="progress-container">
                    <input type="range" id="seek-bar" class="seek-slider" value="0" min="0" max="100" step="0.1">
                </div>

                <div class="time-display">
                    <span id="current-time">0:00</span> / <span id="duration">0:00</span>
                </div>

                <div class="volume-container">
                    <button class="icon-btn" id="mute-btn" aria-label="Mute">
                        <svg id="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                        <svg id="mute-icon" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    </button>
                    <input type="range" id="volume-bar" class="volume-slider" value="100" min="0" max="100">
                </div>
            </div>
        </div>

        <h2 class="projects-header">Our Projects</h2>
        <div class="projects-grid" id="projects-grid">
            <div class="loading">Loading repositories from GitHub...</div>
        </div>

        <a href="https://github.com/goremenuteam" class="btn org-btn" target="_blank" rel="noopener">Visit Our GitHub Profile</a>
    </div>

    <script>
        const media = document.getElementById('media-element');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const seekBar = document.getElementById('seek-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const muteBtn = document.getElementById('mute-btn');
        const volumeIcon = document.getElementById('volume-icon');
        const muteIcon = document.getElementById('mute-icon');
        const volumeBar = document.getElementById('volume-bar');
        const statusEl = document.getElementById('player-status');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        playPauseBtn.addEventListener('click', () => {
            if (media.paused) {
                media.play().then(() => {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    statusEl.textContent = 'Playing Femboy Friday';
                }).catch(() => {
                    statusEl.textContent = 'Media file not found (place femboy-friday.mp4 or .mp3 alongside main.html)';
                });
            } else {
                media.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                statusEl.textContent = 'Paused';
            }
        });

        media.addEventListener('timeupdate', () => {
            if (!isNaN(media.duration)) {
                const progress = (media.currentTime / media.duration) * 100;
                seekBar.value = progress;
                currentTimeEl.textContent = formatTime(media.currentTime);
            }
        });

        media.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(media.duration);
        });

        seekBar.addEventListener('input', () => {
            if (!isNaN(media.duration)) {
                media.currentTime = (seekBar.value / 100) * media.duration;
            }
        });

        muteBtn.addEventListener('click', () => {
            media.muted = !media.muted;
            if (media.muted) {
                volumeIcon.style.display = 'none';
                muteIcon.style.display = 'block';
            } else {
                volumeIcon.style.display = 'block';
                muteIcon.style.display = 'none';
            }
        });

        volumeBar.addEventListener('input', () => {
            media.volume = volumeBar.value / 100;
            media.muted = media.volume === 0;
            if (media.muted) {
                volumeIcon.style.display = 'none';
                muteIcon.style.display = 'block';
            } else {
                volumeIcon.style.display = 'block';
                muteIcon.style.display = 'none';
            }
        });

        media.addEventListener('ended', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            statusEl.textContent = 'Ended';
        });

        async function fetchProjects() {
            const grid = document.getElementById('projects-grid');
            try {
                const response = await fetch('https://api.github.com/users/goremenuteam/repos');
                if (!response.ok) throw new Error('Failed to fetch repositories');
                const repos = await response.json();

                grid.innerHTML = '';
                if (repos.length === 0) {
                    grid.innerHTML = '<div class="loading">No public repositories found.</div>';
                    return;
                }

                repos.forEach(repo => {
                    if (repo.fork) return;

                    const card = document.createElement('div');
                    card.className = 'project-card';

                    const homepage = repo.homepage;
                    let primaryLink = repo.html_url;
                    let primaryText = 'GitHub Repo';

                    if (homepage) {
                        primaryLink = homepage;
                        primaryText = 'Open Project';
                    }

                    card.innerHTML = `
                        <div>
                            <div class="project-title">${repo.name}</div>
                            <div class="project-desc">${repo.description || 'No description provided.'}</div>
                        </div>
                        <div class="project-links">
                            <a href="${primaryLink}" class="btn" target="_blank" rel="noopener">${primaryText}</a>
                            ${homepage ? `<a href="${repo.html_url}" class="btn btn-outline" target="_blank" rel="noopener">Source</a>` : ''}
                        </div>
                    `;

                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = '<div class="loading">Unable to load projects automatically. Check out our GitHub profile below!</div>';
            }
        }

        fetchProjects();
    </script>
</body>
</html>
