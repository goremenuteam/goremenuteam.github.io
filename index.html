<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GORE Menu Team</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #e0e0e0;
            background-color: #0f0f12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #18181f;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 1.1rem;
            color: #a0a0b0;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #6200ee;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
        }
        .btn:hover {
            background-color: #4b00b5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GORE Menu Team</h1>
        <p>Official page for GORE Menu projects and releases.</p>
        <a href="https://github.com/goremenuteam" class="btn" target="_blank" rel="noopener">Visit Our GitHub</a>
    </div>
</body>
</html>
